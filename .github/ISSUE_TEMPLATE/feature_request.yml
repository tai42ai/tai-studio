name: Feature request
description: Propose an addition or change to tai-studio
labels: ['enhancement']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added or changed, and what problem does it solve? Remember the import boundaries — a feature package imports only @tai42/studio-sdk and @tai42/api-client, never another feature.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tai-studio version
      description: The version you are using, if relevant.
      placeholder: '0.1.1'
    validations:
      required: false
