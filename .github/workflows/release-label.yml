name: release-label

# A pull request's Conventional-Commits title and body decide the release bump. This
# gate projects that bump from the manifest's version and runs the release API-diff gate
# — the same gate release-npm.yml runs on the tag — on the public-API change the pull
# request carries: a surface item counts only when it is breaking both against the newest
# published version and between the pull request's base and the checkout. A counted item
# under a bump its label could not honestly carry is refused here, before the merge,
# never after the tag. The `edited` type is included so re-labelling the release by
# editing the pull request body (a `!`, a `BREAKING CHANGE:` footer, a `Release-As:` line)
# re-runs the check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-label:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        # On the pull_request event this checks out the merge commit
        # (refs/pull/<number>/merge, the head merged into the base branch tip), so
        # the gate reads the base side's reports at its first parent, HEAD^1. Full
        # history + tags: fetch-depth 0 keeps that parent and brings the tags whose
        # committed reports the published side reads.
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The gate imports typescript to parse the reports; it reads the committed
      # reports as checked out (the `check` job's api:check keeps them matching the
      # built surface on every pull request), so no workspace build is needed here.
      - run: pnpm install --frozen-lockfile
      - name: Refuse a mislabelled release
        # The title and body reach the script through the environment, never
        # interpolated into the shell, so a backtick or $(...) in a pull request
        # body cannot run on the runner. The npm reads that choose the published
        # version are public (no token) and the package list and versions come from
        # the repo's own release-please config and manifest, so this runs unchanged
        # on a fork.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/release-label-check.mjs
