name: release-please

# Release trains: tags mint on the train's own green. The release job runs on the
# push of the `release-please` merge commit to main, without waiting for main's `ci`
# to rerun; normal commits still open/update the release PR via the post-`ci`
# `workflow_run`. release-please is idempotent on tags, so a later `workflow_run` for
# the same merge commit finds the tag present and no-ops.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time; never cancel an in-flight release PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (startsWith(github.event.head_commit.message, 'chore: release') ||
        startsWith(github.event.head_commit.message, 'chore(main): release')))
    permissions:
      contents: write # push the release PR branch; create the tag + GitHub Release
      pull-requests: write # open and update the release PR
    steps:
      # The PAT (not GITHUB_TOKEN) is required so the release PR triggers CI and
      # the tag it creates on merge triggers release-npm.yml — refs written by
      # GITHUB_TOKEN do not fire workflows.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
