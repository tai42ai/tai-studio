# Redis for the e2e boot recipe.
#
# NOT A PRODUCTION TEMPLATE. This exists only to give the local end-to-end run a
# throwaway Redis: no password, ephemeral data, LOOPBACK-BOUND ports (127.0.0.1)
# so nothing is reachable off the host. A real deployment runs a managed Redis
# with auth, persistence, and network policy — never this file.
#
# The host port is 6380 (not 6379) so the recipe never collides with a Redis a
# developer already runs locally. The skeleton's ACCESS_CONTROL_REDIS_URL /
# CONNECTOR_STORE_REDIS_URL point here (see boot.sh).
name: tai-studio-e2e

services:
  # PLAIN redis (module-free): the access-control backend keeps only plain-Redis
  # state here — the api-key IDENTITY record (`ac:key:{hash}` HASH) and the
  # per-user live-context (`ac:context:{user_id}` HASH) plus the `ac:policy_version`
  # counter. Policy bodies and route mappings live in Postgres. No RedisJSON module
  # is used or required, so this runs on the stock `redis:7-alpine` image and the
  # suite proves the stack works without redis-stack.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30

  # Postgres for the connectors router's catalog + token store. The `connectors`
  # router is loaded by the e2e manifest, and its startup catalog refresh opens
  # Postgres, so the recipe provides one. The connector framework DDL
  # (tai_skeleton.init.sql) is applied by boot.sh after the DB is healthy.
  # Loopback-bound on 55432 so it never collides with a local Postgres on 5432.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tai
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tai']
      interval: 1s
      timeout: 3s
      retries: 30
