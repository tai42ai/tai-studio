[project]
name = "docs-demo-monitoring"
version = "0.1.0"
description = "Self-contained monitoring backend for the tai-studio docs-screenshot pipeline: a real MonitoringWriter/MonitoringReader over an in-memory store seeded with a deterministic demo dataset, so the Studio observability screens render populated real data with no external service."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "tai42", email = "oss@tai42.ai" }]
dependencies = ["tai42-contract"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_demo_monitoring"]
