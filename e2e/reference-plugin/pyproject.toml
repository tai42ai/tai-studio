[project]
name = "reference-plugin"
version = "0.1.0"
description = "Reference Studio plugin for tai-studio end-to-end tests: a Python tool package plus a Studio front-end bundle (built into src/reference_plugin/studio/)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "tai42", email = "oss@tai42.ai" }]
dependencies = ["tai42-contract"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The compiled Studio bundle lives at src/reference_plugin/studio, INSIDE the
# package directory, so the standard package inclusion ships both the tools and
# the front-end that the skeleton serves under `studio_dist_path` — a single
# `pip install reference-plugin` provides both. (No force-include: that would add
# the same files a second time and fail the wheel build with a duplicate-entry
# error, since the studio dir is already under the package.)
packages = ["src/reference_plugin"]
