packages:
  - apps/*
  - packages/*
  - packages/features/*
  - e2e

# Single source of truth for the ranges of third-party deps shared across more
# than one workspace package. Package manifests reference these with `catalog:`.
catalog:
  '@tanstack/react-query': ^5.62.0
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^22.10.5
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^4.7.0
  '@vitest/coverage-v8': ^2.1.8
  eslint: ^9.17.0
  eslint-plugin-boundaries: ^6.0.2
  jsdom: ^25.0.1
  prettier: ^3.4.2
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^5.7.3
  uqr: ^0.1.3
  vite: ^6.0.7
  vitest: ^3.2.6

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - msw
