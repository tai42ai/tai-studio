packages:
  - apps/*
  - packages/*
  - packages/features/*
  - e2e

# Single source of truth for the ranges of third-party deps shared across more
# than one workspace package. Package manifests reference these with `catalog:`.
catalog:
  '@tanstack/react-query': ^5.62.0
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^22.10.5
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^4.7.0
  '@vitest/coverage-v8': ^3.2.6
  eslint: ^9.17.0
  eslint-plugin-boundaries: ^6.0.2
  jsdom: ^25.0.1
  prettier: ^3.9.6
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^5.7.3
  uqr: ^0.1.3
  vite: ^6.4.3
  vitest: ^3.2.6

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - msw

overrides:
  # Pin the 5.x brace-expansion line to the DoS-patched >=5.0.8 (minimatch@10, via
  # typescript-eslint, pulls it). The older 1.x/2.x lines reached through
  # eslint-plugin-jsx-a11y's minimatch@3 and the coverage tooling's minimatch@9 have
  # no patched release and cannot move to 5.x without breaking jsx-a11y's
  # default-export minimatch import — a dev-only, non-exploitable residual.
  'brace-expansion@5': '>=5.0.8'
  # postcss source-map path traversal, patched at 8.5.18.
  postcss: '>=8.5.18'
