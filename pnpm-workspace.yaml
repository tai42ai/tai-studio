packages:
  - apps/*
  - packages/*
  - packages/features/*
  - e2e

# Single source of truth for the ranges of third-party deps shared across more
# than one workspace package. Package manifests reference these with `catalog:`.
catalog:
  '@tanstack/react-query': ^5.103.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.6
  '@types/node': ^22.10.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.2.0
  '@vitest/coverage-v8': ^5.0.4
  eslint: ^9.17.0
  eslint-plugin-boundaries: ^7.2.0
  jsdom: ^30.0.1
  prettier: ^3.9.9
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^6.0.3
  uqr: ^0.1.3
  vite: ^6.4.4
  vitest: ^5.0.5

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - msw

overrides:
  # Pin both brace-expansion lines to their DoS-patched releases: 5.x (minimatch@10,
  # via typescript-eslint) at >=5.0.8, and 1.x (minimatch@3, via
  # eslint-plugin-jsx-a11y, which cannot move to 5.x without breaking its
  # default-export minimatch import) at >=1.1.21. Dev-only.
  'brace-expansion@5': '>=5.0.8'
  'brace-expansion@1': '>=1.1.21 <2'
  # postcss source-map path traversal, patched at 8.5.18.
  postcss: '>=8.5.18'
  # js-yaml prototype-pollution / special-key handling in the 4.x line, patched
  # at 4.3.2. Dev-only, reached transitively through eslint -> @eslint/eslintrc.
  'js-yaml@4': '4.3.2'
  # baseline-browser-mapping data-integrity advisory in the 2.x line, patched at
  # 2.11.0. Dev-only, reached transitively through browserslist.
  'baseline-browser-mapping': '>=2.11.0'
  # source-map-js indexed source-map section-offset DoS, patched at 1.2.2. Dev-only,
  # reached transitively through vite -> postcss.
  'source-map-js': '>=1.2.2'
  # nanoid custom-generator infinite loop in the 3.x line, patched at 3.3.18. Dev-only,
  # reached transitively through vite -> postcss.
  'nanoid@3': '>=3.3.18 <4'
  # handlebars JavaScript-injection advisories in the 4.x line, patched at 4.7.10.
  # Dev-only, reached transitively through eslint-plugin-boundaries.
  'handlebars@4': '>=4.7.10 <5'
  # fast-uri scheme-spoofing, host-confusion, scheme-injection and path-equivalence
  # advisories in the 3.x line, patched at 3.1.9. Dev-only, reached transitively
  # through @microsoft/api-extractor -> ajv.
  'fast-uri@3': '>=3.1.9 <4'

minimumReleaseAgeExclude:
  - '@tai42/jq-studio@0.1.0 || 0.1.1 || 0.1.2 || 0.1.3 || 0.1.6'
